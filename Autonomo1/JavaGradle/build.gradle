// set as java application
apply plugin: 'application'

// define main class
// (MODIFICADO: se usa application { mainClass } en lugar de mainClassName,
//  que esta obsoleto en versiones nuevas de Gradle)
application {
  mainClass = 'Multiply'
}

// task which will run Main with default parameters,
// can be overwritten with: gradle runApp --args '3 4'
task runApp(type: JavaExec) {
  group 'Multiply tasks'
  description 'Tasks which runs Multiply with default parameters'

  classpath = sourceSets.main.runtimeClasspath

  mainClass = 'Multiply'

  // default arguments if non are given
  args '1'
  args '2'
}

// task which will run Main with default parameters,
// but also accepts new parameter this time with given names
// Example: gradle runAppAgain -Pnum1=9 -Pnum2=10
// Example2 (this will make Gradle run more quietly in the console):
//   gradle runAppAgain -Pnum1=9 -Pnum2=10 -q --console=plain
task runAppAgain(type: JavaExec) {
  group 'Multiply tasks'
  description 'Tasks which runs Multiply with default parameters or given values'

  classpath = sourceSets.main.runtimeClasspath

  mainClass = 'Multiply'

  // MODIFICADO (Try 1): valores por defecto cuando no se da ninguno o solo un parametro
  //   gradle runAppAgain                 -> 1 * 1
  //   gradle runAppAgain -Pnum1=5        -> 5 * 1
  //   gradle runAppAgain -Pnum2=7        -> 1 * 7
  //   gradle runAppAgain -Pnum1=9 -Pnum2=10 -> 9 * 10
  def n1 = project.hasProperty("num1") ? project.getProperty('num1') : '1'
  def n2 = project.hasProperty("num2") ? project.getProperty('num2') : '1'
  args(n1, n2)
}

// task that runs the Fraction Main which does not use arguments: gradle runFraction
task runFraction(type: JavaExec) {
  group 'Fraction Tasks'
  description 'Tasks which runs Fraction with no arguments'

  classpath = sourceSets.main.runtimeClasspath

  mainClass = 'Fraction'
}

// Try:
// 1. Change Fraction.main so it accepts 2 arguments           -> HECHO en Fraction.java
// 2. Create a new gradle tasks that accepts two arguments and
//    can be called as: gradle runFrac -Pdenom=4 -Pnum=3 or as gradle runFrac -Pnum=3 -Pdenom=4 ,
//    also make sure it can run with only 1 or no arguments    -> HECHO: tarea runFrac

// MODIFICADO (Try 2): nueva tarea runFrac
//   gradle runFrac -Pnum=3 -Pdenom=4   -> 3/4
//   gradle runFrac -Pdenom=4 -Pnum=3   -> 3/4 (el orden no importa, son propiedades con nombre)
//   gradle runFrac -Pnum=3             -> 3/1 (denominador por defecto 1)
//   gradle runFrac -Pdenom=5           -> 1/5 (numerador por defecto 1)
//   gradle runFrac                     -> 1/3 (valores por defecto del programa original)
task runFrac(type: JavaExec) {
  group 'Fraction Tasks'
  description 'Runs Fraction with -Pnum and -Pdenom (both optional, any order)'

  classpath = sourceSets.main.runtimeClasspath

  mainClass = 'Fraction'

  if (project.hasProperty("num") && project.hasProperty("denom")) {
    args(project.getProperty('num'), project.getProperty('denom'))
  } else if (project.hasProperty("num")) {
    args(project.getProperty('num'), '1')
  } else if (project.hasProperty("denom")) {
    args('1', project.getProperty('denom'))
  }
  // sin propiedades: no se envian argumentos y Fraction usa 1/3
}

